# 8081, 8082 포트의 정적 라우팅
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-auth-route
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              metadata:
                response-timeout: 5000
              filters:
                - name: CircuitBreaker
                  args:
                    name: identityAuth
                    fallbackUri: forward:/fallback/identity-auth

            - id: identity-api-route
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/members/**,/api/scraps/**
              metadata:
                response-timeout: 5000
              filters:
                - name: CircuitBreaker
                  args:
                    name: identityApi
                    fallbackUri: forward:/fallback/identity-api

            - id: commerce-search-route
              uri: ${COMMERCE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/search/**
              metadata:
                response-timeout: 3000
              filters:
                - name: CircuitBreaker
                  args:
                    name: commerceSearch
                    fallbackUri: forward:/fallback/commerce-search

            - id: commerce-api-route
              uri: ${COMMERCE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/products/**,/api/purchases/**,/api/offers/**,/api/carts/**,/api/payments/**,/api/deposits/**,/api/settlements/**
              metadata:
                response-timeout: 15000
              filters:
                - name: CircuitBreaker
                  args:
                    name: commerceApi
                    fallbackUri: forward:/fallback/commerce-api

            - id: recommendation-api-route
              uri: ${RECOMMENDATION_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/recommendations/**
