spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dear}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100

messaging:
  rabbitmq:
    stream:
      host: ${RABBITMQ_STREAM_HOST}
      port: ${RABBITMQ_STREAM_PORT}
      username: ${RABBITMQ_STREAM_USERNAME}
      password: ${RABBITMQ_STREAM_PASSWORD}
      virtual-host: ${RABBITMQ_STREAM_VIRTUAL_HOST:/}
      consumer-restart-delay: 5s
      consumer-restart-max-attempts: 5