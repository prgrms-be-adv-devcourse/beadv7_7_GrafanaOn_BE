name: CI - Build & Test

on:
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE commerce_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE identity_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE financial_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE recommendation_test;"

      - name: Build & Test commerce-service
        run: ./gradlew :commerce-service:build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/commerce_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Upload commerce-service test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-service-test-report
          path: commerce-service/build/reports/tests/test

      - name: Build & Test identity-service
        run: ./gradlew :identity-service:build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/identity_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Upload identity-service test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: identity-service-test-report
          path: identity-service/build/reports/tests/test

      - name: Build & Test recommendation-service
        run: ./gradlew :recommendation-service:build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/recommendation_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Upload recommendation-service test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-service-test-report
          path: recommendation-service/build/reports/tests/test

      - name: Build & Test gateway-service
        run: ./gradlew :gateway-service:build

      - name: Build & Test financial-service
        run: ./gradlew :financial-service:build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/financial_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Upload financial-service test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: financial-service-test-report
          path: financial-service/build/reports/tests/test