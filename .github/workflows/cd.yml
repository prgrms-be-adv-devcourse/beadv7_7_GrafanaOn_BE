name: CD - Build & Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for scripts
        run: |
          chmod +x ./gradlew
          chmod +x ./deploy/scripts/deploy-container.sh

      - name: Ensure Docker network exists
        run: docker network inspect dear-net >/dev/null 2>&1 || docker network create dear-net

      - name: Build commerce-service image
        run: docker build -t commerce-service:latest -f commerce-service/Dockerfile .

      - name: Create commerce-service .env
        run: |
          cat > commerce-service/.env << EOF
          SPRING_PROFILES_ACTIVE=prod
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_DRIVER=${{ vars.DB_DRIVER }}
          MEMBER_CLIENT_BASE_URL=${{ secrets.MEMBER_CLIENT_BASE_URL }}
          PRODUCT_CLIENT_BASE_URL=${{ secrets.PRODUCT_CLIENT_BASE_URL }}
          OFFER_CLIENT_BASE_URL=${{ secrets.OFFER_CLIENT_BASE_URL }}
          WALLET_CLIENT_BASE_URL=${{ secrets.WALLET_CLIENT_BASE_URL }}
          AWS_S3_BUCKET_NAME=${{ vars.AWS_S3_BUCKET_NAME }}
          AWS_REGION=${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
          TOSS_SECRET_KEY=${{ secrets.TOSS_SECRET_KEY }}
          EOF
          chmod 600 commerce-service/.env

      - name: Deploy commerce-service
        run: ./deploy/scripts/deploy-container.sh commerce-service 8082 8082 commerce-service/.env

      - name: Remove commerce-service .env
        if: always()
        run: rm -f commerce-service/.env

      - name: Build identity-service image
        run: docker build -t identity-service:latest -f identity-service/Dockerfile .

      - name: Create identity-service .env
        run: |
          cat > identity-service/.env << EOF
          SPRING_PROFILES_ACTIVE=prod
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_ISSUER=${{ vars.JWT_ISSUER }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRATION=${{ vars.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION=${{ vars.JWT_REFRESH_TOKEN_EXPIRATION }}
          AUTH_REFRESH_COOKIE_NAME=${{ vars.AUTH_REFRESH_COOKIE_NAME }}
          AUTH_COOKIE_SECURE=${{ vars.AUTH_COOKIE_SECURE }}
          AUTH_COOKIE_SAME_SITE=${{ vars.AUTH_COOKIE_SAME_SITE }}
          AUTH_COOKIE_PATH=${{ vars.AUTH_COOKIE_PATH }}
          COMMERCE_BASE_URL=${{ vars.COMMERCE_BASE_URL }}
          AES_SECRET_KEY=${{ secrets.AES_SECRET_KEY }}
          AES_SECRET_IV=${{ secrets.AES_SECRET_IV }}
          EOF
          chmod 600 identity-service/.env

      - name: Deploy identity-service
        run: ./deploy/scripts/deploy-container.sh identity-service 8081 8081 identity-service/.env

      - name: Remove identity-service .env
        if: always()
        run: rm -f identity-service/.env

      - name: Build gateway-service image
        run: docker build -t gateway-service:latest -f gateway-service/Dockerfile .

      - name: Create gateway-service .env
        run: |
          cat > gateway-service/.env << EOF
          SPRING_PROFILES_ACTIVE=prod
          FRONTEND_ORIGIN=${{ vars.FRONTEND_ORIGIN }}
          JWT_ISSUER=${{ vars.JWT_ISSUER }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
          chmod 600 gateway-service/.env

      - name: Deploy gateway-service
        run: ./deploy/scripts/deploy-container.sh gateway-service 8080 8080 gateway-service/.env

      - name: Remove gateway-service .env
        if: always()
        run: rm -f gateway-service/.env