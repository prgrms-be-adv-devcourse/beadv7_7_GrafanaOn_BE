name: CD - Deploy to EC2

on:
  #테스트용 트리거
  #pull_request:
   # branches:  - dev
  push:
    branches:
      - main

jobs:
  deploy-commerce:
    uses: ./.github/workflows/deploy-service.yml
    with:
      service_name: commerce-service
      service_port: "8082"
      green_port: "8091"
      use_blue_green: true
    secrets:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  deploy-identity:
    uses: ./.github/workflows/deploy-service.yml
    with:
      service_name: identity-service
      service_port: "8081"
      green_port: "8092"
      use_blue_green: true
    secrets:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  deploy-gateway:
    needs: [deploy-commerce, deploy-identity]
    uses: ./.github/workflows/deploy-service.yml
    with:
      service_name: gateway-service
      service_port: "8080"
      use_blue_green: false