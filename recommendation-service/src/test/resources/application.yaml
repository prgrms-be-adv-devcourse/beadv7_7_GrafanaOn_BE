spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dear}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA:recommendation}

  ai:
    model:
      embedding: ollama
      chat: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${recommendation.embedding.model-name}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:recommendation}
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100

recommendation:

  embedding:
    model-name: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

  # common 의 SchedulingConfig 가 @EnableScheduling 이라 테스트 컨텍스트에서도 스케줄러가 산다.
  # 첫 실행을 멀리 미뤄 테스트 중에는 폴링이 돌지 않게 한다.
  inbox:
    batch-size: 100
    poll-interval-ms: 5000
    initial-delay-ms: 3600000
    max-retry-count: 3

  vector:
    dimensions: 1024
    # 운영 코드가 product_vector SQL 을 수식할 때 쓰는 값. main 의 application.yaml 과 같다.
    schema: ${DB_SCHEMA:recommendation}
    # ddl-auto 는 JPA 엔티티만 만든다. product_vector 는 엔티티가 아니라
    # ProductVectorSchemaInitializer 가 만든다.
    initialize-schema: true

  # 테스트 클래스패스의 application.yaml 은 main 의 것을 대체한다(병합이 아니다).
  # RecommendationService 가 @Value 로 읽으므로 여기에도 있어야 컨텍스트가 뜬다.
  similar:
    max-distance: 0.40
    default-size: 10
    max-size: 50

messaging:
  rabbitmq:
    stream:
      enabled: false
