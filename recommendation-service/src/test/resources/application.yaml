spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dear}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA:recommendation}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100
