name: dear-elasticsearch

services:
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile
    image: dear-elasticsearch:9.4.2
    container_name: elasticsearch
    restart: unless-stopped

    environment:
      # 단일 노드 구성. 클러스터 구성이 아니므로 discovery를 생략한다.
      discovery.type: single-node

      # 내부망에서만 접근하므로 인증/TLS를 끈다.
      # 외부 포트 노출 x
      xpack.security.enabled: "false"

      # 힙 1GB. 문서 3만 건 규모에는 충분하다.
      # ES 권장에 따라 Xms와 Xmx를 동일하게 둔다.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

      TZ: Asia/Seoul

    # commerce-service가 같은 네트워크에서 http://elasticsearch:9200 으로 접근

    volumes:
      - es-data:/usr/share/elasticsearch/data

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    networks:
      - dear-net

volumes:
  es-data:

networks:
  dear-net:
    external: true