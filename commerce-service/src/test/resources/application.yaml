spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dear}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100

member:
  client:
    base-url: ${MEMBER_CLIENT_BASE_URL:http://localhost:8081}

product:
  client:
    base-url: ${PRODUCT_CLIENT_BASE_URL:http://localhost:8082}

offer:
  client:
    base-url: ${OFFER_CLIENT_BASE_URL:http://localhost:8082}

wallet:
  client:
    base-url: ${WALLET_CLIENT_BASE_URL:http://localhost:8082}

recommendation:
  client:
    base-url: ${RECOMMENDATION_CLIENT_BASE_URL:http://localhost:8083}

secret:
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:fakeAwsS3BucketName}
    region: ${AWS_REGION:fakeAwsRegion}
    credentials:
      access-key: ${AWS_ACCESS_KEY:fakeAwsAccessKey}
      secret-key: ${AWS_SECRET_KEY:fakeAwsSecretKey}
