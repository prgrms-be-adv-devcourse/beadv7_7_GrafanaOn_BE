spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  rabbitmq:
    host: ${RABBITMQ_STREAM_HOST}
    port: 5672
    username: ${RABBITMQ_STREAM_USERNAME}
    password: ${RABBITMQ_STREAM_PASSWORD}
    virtual-host: ${RABBITMQ_STREAM_VIRTUAL_HOST:/}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100
