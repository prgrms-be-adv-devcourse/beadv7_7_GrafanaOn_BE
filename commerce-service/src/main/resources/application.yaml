spring:
  application:
    name: commerce-service
  profiles:
    active: local

server:
  port: 8082

cart:
  client:
    base-url: ${CART_CLIENT_BASE_URL:${order.client.base-url}}

order:
  client:
    base-url: ${ORDER_CLIENT_BASE_URL}

member:
  client:
    base-url: ${MEMBER_CLIENT_BASE_URL:${order.client.base-url}}

secret:
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME}
    region: ${AWS_REGION}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
