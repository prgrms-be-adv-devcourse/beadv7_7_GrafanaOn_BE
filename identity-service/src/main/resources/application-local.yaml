spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dear
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100

auth:
  cookie:
    secure: false
    
identity:
  client:
    commerce-base-url: http://localhost:8082
