spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dear}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
auth:
  jwt:
    issuer: test-identity-service
    # 테스트용 Secret
    secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LW11c3QtYmUtMzItYnl0ZXMtbG9uZw==
    access-token-expiration: 5m
    refresh-token-expiration: 1h

  cookie:
    name: refreshToken
    secure: false
    same-site: Strict
    path: /api/auth

identity:
  client:
    commerce-base-url: http://localhost:8082
  security:
